[project]
name = "fire-calculator"
version = "0.1.0"
description = "FIRE Number Calculator and Tracker"
dependencies = [
    "django>=4.2.0",
    "djangorestframework>=3.14.0",
    "django-cors-headers>=4.0.0",
    "python-decouple>=3.8",
    "whitenoise>=6.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
