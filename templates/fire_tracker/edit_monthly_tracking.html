{% extends 'fire_tracker/base.html' %}

{% block title %}Edit Monthly Tracking - FIRE Calculator{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="bg-white rounded-lg shadow-md p-6">
        <div class="mb-6">
            <h1 class="text-2xl font-bold text-gray-900">Edit Monthly Tracking</h1>
            <p class="text-gray-600">{{ tracking.month|date:"F Y" }}</p>
        </div>

        <form method="post" class="space-y-4">
            {% csrf_token %}
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label for="income" class="block text-sm font-medium text-gray-700 mb-2">Monthly Income</label>
                    <div class="relative">
                        <span class="absolute left-3 top-2 text-gray-500">{{ currency_symbol }}</span>
                        <input type="number" name="income" id="income" 
                               value="{{ tracking.income|floatformat:2 }}"
                               min="0" step="0.01" required
                               class="w-full pl-8 pr-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    </div>
                </div>
                
                <div>
                    <label for="expenses" class="block text-sm font-medium text-gray-700 mb-2">Monthly Expenses</label>
                    <div class="relative">
                        <span class="absolute left-3 top-2 text-gray-500">{{ currency_symbol }}</span>
                        <input type="number" name="expenses" id="expenses" 
                               value="{{ tracking.expenses|floatformat:2 }}"
                               min="0" step="0.01" required
                               class="w-full pl-8 pr-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    </div>
                </div>
            </div>
            
            <div>
                <label for="net_worth" class="block text-sm font-medium text-gray-700 mb-2">Net Worth</label>
                <div class="relative">
                    <span class="absolute left-3 top-2 text-gray-500">{{ currency_symbol }}</span>
                    <input type="number" name="net_worth" id="net_worth" 
                           value="{{ tracking.net_worth|floatformat:2 }}"
                           min="0" step="0.01" required
                           class="w-full pl-8 pr-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                </div>
            </div>
            
            <div>
                <label for="notes" class="block text-sm font-medium text-gray-700 mb-2">Notes (Optional)</label>
                <textarea name="notes" id="notes" rows="3" 
                          placeholder="Any notes about this month's finances..."
                          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">{{ tracking.notes }}</textarea>
            </div>
            
            <div class="flex justify-end space-x-4">
                <a href="{% url 'fire_tracker:monthly_tracking' %}" class="px-4 py-2 border border-gray-300 rounded-md text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    Cancel
                </a>
                <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    Update Entry
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
